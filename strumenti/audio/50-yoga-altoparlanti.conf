# Yoga Slim 7x - "Altoparlanti potenziati" SENZA toccare il limite di sicurezza del kernel.
# Canali PCM misurati con i microfoni interni: 0,1 (FL,FR) = woofer   2,3 (RL,RR) = tweeter.
# PipeWire con audio stereo pilota solo i woofer: qui si aggiunge il crossover verso i tweeter.
# Ingresso stereo -> passa-alto 110 Hz -> compressore (soglia -24 dBFS, 3:1, +12 dB) -> limitatore -1.5 dBFS
#   -> woofer : bassi sotto 650 Hz limitati a -9 dBFS (come il regolatore Dolby di Windows), poi passa-basso 3 kHz (LR4)
#   -> tweeter: passa-alto 3 kHz (LR4), -6 dB   (mai bassi ai tweeter)
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Altoparlanti potenziati"
      media.name       = "Altoparlanti potenziati"
      filter.graph = {
        nodes = [
          { type = builtin name = hpL label = bq_highpass control = { "Freq" = 110.0 "Q" = 0.707 } }
          { type = builtin name = hpR label = bq_highpass control = { "Freq" = 110.0 "Q" = 0.707 } }
          { type = ladspa name = comp plugin = sc4_1882 label = sc4
            control = { "RMS/peak" = 0.0 "Attack time (ms)" = 5.0 "Release time (ms)" = 200.0
                        "Threshold level (dB)" = -24.0 "Ratio (1:n)" = 3.0 "Knee radius (dB)" = 6.0 "Makeup gain (dB)" = 12.0 } }
          { type = ladspa name = lim plugin = fast_lookahead_limiter_1913 label = fastLookaheadLimiter
            control = { "Input gain (dB)" = 6.0 "Limit (dB)" = -1.5 "Release time (s)" = 0.05 } }
          { type = builtin name = splitL label = copy }
          { type = builtin name = splitR label = copy }
          { type = builtin name = bL1 label = bq_lowpass  control = { "Freq" = 650.0 "Q" = 0.707 } }
          { type = builtin name = bL2 label = bq_lowpass  control = { "Freq" = 650.0 "Q" = 0.707 } }
          { type = builtin name = bR1 label = bq_lowpass  control = { "Freq" = 650.0 "Q" = 0.707 } }
          { type = builtin name = bR2 label = bq_lowpass  control = { "Freq" = 650.0 "Q" = 0.707 } }
          { type = builtin name = mL1 label = bq_highpass control = { "Freq" = 650.0 "Q" = 0.707 } }
          { type = builtin name = mL2 label = bq_highpass control = { "Freq" = 650.0 "Q" = 0.707 } }
          { type = builtin name = mR1 label = bq_highpass control = { "Freq" = 650.0 "Q" = 0.707 } }
          { type = builtin name = mR2 label = bq_highpass control = { "Freq" = 650.0 "Q" = 0.707 } }
          { type = ladspa name = blim plugin = fast_lookahead_limiter_1913 label = fastLookaheadLimiter
            control = { "Input gain (dB)" = 0.0 "Limit (dB)" = -9.0 "Release time (s)" = 0.1 } }
          { type = builtin name = sumL label = mixer }
          { type = builtin name = sumR label = mixer }
          { type = builtin name = wL1 label = bq_lowpass  control = { "Freq" = 3000.0 "Q" = 0.707 } }
          { type = builtin name = wL2 label = bq_lowpass  control = { "Freq" = 3000.0 "Q" = 0.707 } }
          { type = builtin name = wR1 label = bq_lowpass  control = { "Freq" = 3000.0 "Q" = 0.707 } }
          { type = builtin name = wR2 label = bq_lowpass  control = { "Freq" = 3000.0 "Q" = 0.707 } }
          { type = builtin name = tL1 label = bq_highpass control = { "Freq" = 3000.0 "Q" = 0.707 } }
          { type = builtin name = tL2 label = bq_highpass control = { "Freq" = 3000.0 "Q" = 0.707 } }
          { type = builtin name = tR1 label = bq_highpass control = { "Freq" = 3000.0 "Q" = 0.707 } }
          { type = builtin name = tR2 label = bq_highpass control = { "Freq" = 3000.0 "Q" = 0.707 } }
          { type = builtin name = tgL label = linear control = { "Mult" = -0.35 "Add" = 0.0 } }
          { type = builtin name = tgR label = linear control = { "Mult" = -0.35 "Add" = 0.0 } }
        ]
        links = [
          { output = "hpL:Out" input = "comp:Left input" }
          { output = "hpR:Out" input = "comp:Right input" }
          { output = "comp:Left output"  input = "lim:Input 1" }
          { output = "comp:Right output" input = "lim:Input 2" }
          { output = "lim:Output 1" input = "splitL:In" }
          { output = "lim:Output 2" input = "splitR:In" }
          { output = "splitL:Out" input = "bL1:In" }  { output = "bL1:Out" input = "bL2:In" }  { output = "bL2:Out" input = "blim:Input 1" }
          { output = "splitL:Out" input = "mL1:In" }  { output = "mL1:Out" input = "mL2:In" }
          { output = "blim:Output 1" input = "sumL:In 1" }  { output = "mL2:Out" input = "sumL:In 2" }
          { output = "sumL:Out" input = "wL1:In" }  { output = "wL1:Out" input = "wL2:In" }
          { output = "splitR:Out" input = "bR1:In" }  { output = "bR1:Out" input = "bR2:In" }  { output = "bR2:Out" input = "blim:Input 2" }
          { output = "splitR:Out" input = "mR1:In" }  { output = "mR1:Out" input = "mR2:In" }
          { output = "blim:Output 2" input = "sumR:In 1" }  { output = "mR2:Out" input = "sumR:In 2" }
          { output = "sumR:Out" input = "wR1:In" }  { output = "wR1:Out" input = "wR2:In" }
          { output = "splitL:Out" input = "tL1:In" }  { output = "tL1:Out" input = "tL2:In" }  { output = "tL2:Out" input = "tgL:In" }
          { output = "splitR:Out" input = "tR1:In" }  { output = "tR1:Out" input = "tR2:In" }  { output = "tR2:Out" input = "tgR:In" }
        ]
        inputs  = [ "hpL:In" "hpR:In" ]
        outputs = [ "wL2:Out" "wR2:Out" "tgL:Out" "tgR:Out" ]
      }
      capture.props  = { node.name = "effect_input.yoga_spk"  media.class = Audio/Sink
                         audio.channels = 2 audio.position = [ FL FR ] }
      playback.props = { node.name = "effect_output.yoga_spk" node.passive = true
                         audio.channels = 4 audio.position = [ FL FR RL RR ]
                         target.object = "alsa_output.platform-sound.HiFi__Speaker__sink" }
    }
  }
]
