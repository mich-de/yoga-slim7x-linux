# Yoga Slim 7x: il volume di sistema NON deve comandare "Speakers Volume" (= PA Volume degli amplificatori),
# altrimenti dopo sospensione/riavvio dell'audio il guadagno impostato da 7-VOLUME-AMPLIFICATORI.sh viene sovrascritto.
monitor.alsa.rules = [
  { matches = [ { device.name = "~alsa_card.platform-sound*" } ]
    actions = { update-props = { api.alsa.soft-mixer = true } } }
]
