# Audio Yoga: uscita "Audio Yoga" con il motore Dolby, messa prima della catena degli altoparlanti senza
# compressore ("Altoparlanti (via Audio Yoga)", generata da avvio/audio-yoga.sh).
# Gira in un servizio a parte (audio-yoga.service): il motore carica in memoria il DLL originale e il servizio
# dei filtri di serie lo vieterebbe; cosi' un guasto del motore non ferma la catena che protegge gli altoparlanti.
# Comandi dal vivo:  pw-cli set-param <id del nodo effect_input.audio_yoga> Props '{ params = [ "dolby:Profilo" 2 ] }'
#   Profilo: 0 Dinamico, 1 Film, 2 Musica, 3 Gioco, 4 Voce, 5 Spento;  "dolby:Spinta" in dB;  "dolby:EQ 1".."dolby:EQ 20" in dB
#   "dolby:Surround" -1 come il profilo, 0, 1;  "dolby:Dialoghi" -1, 0, 1..16;  "dolby:Livellatore" -1, 0, 1..10
context.properties = { log.level = 0 }
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt args = { } flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-filter-chain
      args = {
        node.description = "Audio Yoga"
        media.name       = "Audio Yoga"
        filter.graph = {
          nodes = [ { type = ladspa name = dolby plugin = audio_yoga label = audio_yoga control = { "Profilo" = 2.0 "Surround" = -1.0 "Dialoghi" = -1.0 "Livellatore" = -1.0 } } ]
          inputs  = [ "dolby:In L" "dolby:In R" ]
          outputs = [ "dolby:Out L" "dolby:Out R" ]
        }
        audio.rate     = 48000
        audio.channels = 2
        audio.position = [ FL FR ]
        capture.props  = { node.name = "effect_input.audio_yoga" media.class = Audio/Sink }
        playback.props = { node.name = "effect_output.audio_yoga" node.passive = true target.object = "effect_input.yoga_spk_ay" }
      }
    }
]
