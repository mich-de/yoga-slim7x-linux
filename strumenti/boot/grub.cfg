# Fedora 45 KDE live - menu per Lenovo Yoga Slim 7x (Snapdragon X Elite)
# File: EFI/BOOT/grub.cfg nella partizione EFI della chiavetta. Originale della ISO: grub.cfg.orig
# Spiegazioni: STRUMENTI/boot/LEGGIMI.txt
#
# La prima voce fa tutto da sola e senza rete:
#  - TASTIERA e TOUCHPAD: kernel con il device tree interno corretto (bus I2C b80000 a 100 kHz), file
#    STRUMENTI/boot/linux-7.2.11-300.fc45-kbd100k.efi. Nessuno script, nessuna rete: e' nel kernel.
#  - AUDIO: l'initrd aggiuntivo strumenti.cpio installa un servizio che monta STRUMENTI e applica
#    l'uscita "Altoparlanti potenziati" e il guadagno degli amplificatori.
#  - INSTALLAZIONE: a fine installazione il sistema installato riceve da solo le stesse correzioni.
#  (enforcing=0 serve ai file iniettati nella live; il sistema installato resta con SELinux attivo)
search --file --set=root /boot/0xbedbb5cb
set prefix=($root)/boot/grub2
search --no-floppy --file --set=kit /boot/linux-7.2.11-300.fc45-kbd100k.efi
search --no-floppy --file --set=esp /EFI/BOOT/yoga7x-kbd100k.dtb
search --no-floppy --file --set=strum /strumenti.cpio

set default="0"

function load_video {
	insmod efi_gop
	insmod efi_uga
	insmod video_bochs
	insmod video_cirrus
	insmod all_video
}

load_video
set gfxpayload=keep
insmod gzio
insmod part_gpt
insmod ext2

terminal_input console
terminal_output console

set timeout=15
set timeout_style=menu

menuentry "Fedora Live - Yoga Slim 7x - TUTTO AUTOMATICO (tastiera, touchpad, audio)" --class fedora --class gnu-linux --class gnu --class os {
	linux ($kit)/boot/linux-7.2.11-300.fc45-kbd100k.efi quiet rhgb root=live:CDLABEL=Fedora-KDE-Live-45 rd.live.image clk_ignore_unused pd_ignore_unused systemd.tpm2_wait=0 modprobe.blacklist=qcom_q6v5_pas enforcing=0
	initrd ($root)/boot/aarch64/loader/initrd ($strum)/strumenti.cpio
}
menuentry "Fedora Live - Yoga Slim 7x - solo FIX TASTIERA (senza automatismi)" --class fedora --class gnu-linux --class gnu --class os {
	linux ($kit)/boot/linux-7.2.11-300.fc45-kbd100k.efi quiet rhgb root=live:CDLABEL=Fedora-KDE-Live-45 rd.live.image clk_ignore_unused pd_ignore_unused systemd.tpm2_wait=0 modprobe.blacklist=qcom_q6v5_pas
	initrd ($root)/boot/aarch64/loader/initrd
}
menuentry "Fedora Live - Yoga Slim 7x - FIX TASTIERA con device tree esterno" --class fedora --class gnu-linux --class gnu --class os {
	linux ($root)/boot/aarch64/loader/linux quiet rhgb root=live:CDLABEL=Fedora-KDE-Live-45 rd.live.image clk_ignore_unused pd_ignore_unused systemd.tpm2_wait=0 modprobe.blacklist=qcom_q6v5_pas
	initrd ($root)/boot/aarch64/loader/initrd
	devicetree ($esp)/EFI/BOOT/yoga7x-kbd100k.dtb
}
menuentry "Fedora Live - Yoga Slim 7x senza fix (poi STRUMENTI/5-FIX-TASTIERA-SUBITO.sh)" --class fedora --class gnu-linux --class gnu --class os {
	linux ($root)/boot/aarch64/loader/linux quiet rhgb root=live:CDLABEL=Fedora-KDE-Live-45 rd.live.image clk_ignore_unused pd_ignore_unused systemd.tpm2_wait=0 modprobe.blacklist=qcom_q6v5_pas
	initrd ($root)/boot/aarch64/loader/initrd
}
menuentry "Fedora Live - TUTTO AUTOMATICO - messaggi di avvio visibili" --class fedora --class gnu-linux --class gnu --class os {
	linux ($kit)/boot/linux-7.2.11-300.fc45-kbd100k.efi root=live:CDLABEL=Fedora-KDE-Live-45 rd.live.image clk_ignore_unused pd_ignore_unused systemd.tpm2_wait=0 modprobe.blacklist=qcom_q6v5_pas enforcing=0
	initrd ($root)/boot/aarch64/loader/initrd ($strum)/strumenti.cpio
}
menuentry "Fedora Live - voce originale della ISO (senza parametri)" --class fedora --class gnu-linux --class gnu --class os {
	linux ($root)/boot/aarch64/loader/linux quiet rhgb root=live:CDLABEL=Fedora-KDE-Live-45 rd.live.image
	initrd ($root)/boot/aarch64/loader/initrd
}
submenu "Altro -->" {
	menuentry "Fedora Live - FIX TASTIERA - grafica di base (nomodeset)" --class fedora --class gnu-linux --class gnu --class os {
		linux ($kit)/boot/linux-7.2.11-300.fc45-kbd100k.efi quiet rhgb root=live:CDLABEL=Fedora-KDE-Live-45 rd.live.image clk_ignore_unused pd_ignore_unused systemd.tpm2_wait=0 modprobe.blacklist=qcom_q6v5_pas nomodeset
		initrd ($root)/boot/aarch64/loader/initrd
	}
	menuentry "Menu originale della ISO" {
		configfile ($root)/boot/grub2/grub.cfg
	}
}
